services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    image: autonomous-workflow-optimization-agents-api:latest
    env_file:
      - .env
    environment:
      - UVICORN_WORKERS=${UVICORN_WORKERS:-2}
      - TRUST_PROXY_HEADERS=${TRUST_PROXY_HEADERS:-true}
    restart: unless-stopped
    ports:
      - "${API_PORT:-8002}:8002"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=${PUBLIC_API_URL:-http://127.0.0.1:8002}
    image: autonomous-workflow-optimization-agents-frontend:latest
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-4175}:8080"

  prometheus:
    image: prom/prometheus:v2.55.1
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    restart: unless-stopped
    ports:
      - "${PROMETHEUS_PORT:-9092}:9090"
    depends_on:
      api:
        condition: service_healthy
